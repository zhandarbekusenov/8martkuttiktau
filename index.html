<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Наурыз Құттықтау</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #fff5f7;
            overflow-x: hidden;
        }
        .cursive {
            font-family: 'Marck Script', cursive;
        }
        .gradient-text {
            background: linear-gradient(45deg, #ff4e50, #f9d423);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .flower {
            position: absolute;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
            animation: drift var(--duration) ease-in-out infinite;
        }
        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(20px, 30px) rotate(10deg); }
        }
        .card-container {
            perspective: 1000px;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #fee2e2;
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.3);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .btn-grad {
            background-image: linear-gradient(to right, #FF512F 0%, #DD2476  51%, #FF512F  100%);
            transition: 0.5s;
            background-size: 200% auto;
        }
        .btn-grad:hover {
            background-position: right center;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Фондағы гүлдер -->
    <div id="flower-bg"></div>

    <div class="card-container w-full max-w-2xl relative z-10">
        <div class="card rounded-3xl p-8 md:p-12 text-center">
            <header class="mb-8">
                <h2 class="text-pink-500 font-semibold tracking-widest uppercase mb-2">Көктем мерекесі</h2>
                <h1 class="cursive text-5xl md:text-7xl gradient-text mb-4">8 Наурыз</h1>
                <div class="h-1 w-24 bg-pink-300 mx-auto rounded-full"></div>
            </header>

            <main class="space-y-6">
                <p class="text-xl md:text-2xl text-gray-700 leading-relaxed font-light">
                    Аяулы, нәзік те сымбатты <span class="font-semibold text-pink-600">Арулар!</span>
                </p>
                <p class="text-gray-600 text-lg leading-relaxed italic">
                    Сіздерді көктемнің алғашқы мерекесімен шын жүректен құттықтаймыз! Жүздеріңізден күлкі, көңілдеріңізден көктем кетпесін. Әр атқан таңдарыңыз қуанышқа, әр кештеріңіз бақытқа толсын! 
                </p>
                <div class="grid grid-cols-2 gap-4 text-sm font-medium text-pink-500 py-4 border-y border-pink-100">
                    <div>✨ Денсаулық</div>
                    <div>🌸 Сұлулық</div>
                    <div>💖 Махаббат</div>
                    <div>☀️ Сәттілік</div>
                </div>
            </main>

            <footer class="mt-8">
                <button onclick="celebrate()" class="btn-grad text-white px-8 py-3 rounded-full font-bold shadow-lg transform active:scale-95">
                    Құттықтауды қабыл ал! 🌷
                </button>
            </footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        // Фонға гүлдер мен жапырақтар қосу
        const bg = document.getElementById('flower-bg');
        const items = ['🌸', '🌷', '🌺', '🌹', '🍃', '🌼'];
        
        for (let i = 0; i < 20; i++) {
            const el = document.createElement('div');
            el.className = 'flower text-3xl';
            el.innerText = items[Math.floor(Math.random() * items.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = Math.random() * 100 + 'vh';
            el.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            el.style.fontSize = (Math.random() * 20 + 20) + 'px';
            bg.appendChild(el);
        }

        function celebrate() {
            // Конфетти шашу
            const duration = 3 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff69b4', '#ff1493', '#ffd700']
                });
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff69b4', '#ff1493', '#ffd700']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
            
            // Сәл хабарлама көрсету
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "Мерекеңізбен! 🎉";
            setTimeout(() => btn.innerText = originalText, 3000);
        }
    </script>
</body>
</html>
