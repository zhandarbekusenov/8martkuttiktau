<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мерекеңізбен!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .bg-gradient {
            background: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f43f5e;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="bg-gradient relative overflow-hidden">
        <!-- Сәндік элементтер -->
        <div class="absolute top-10 left-10 text-4xl opacity-20">✨</div>
        <div class="absolute bottom-10 right-10 text-4xl opacity-20">🌟</div>

        <div class="glass-card p-8 md:p-12 max-w-lg w-full mx-4 text-center z-10">
            <div class="text-6xl mb-6 floating">🎁</div>
            
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-6 leading-tight">
                Шын жүректен <br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-purple-600">
                    Құттықтаймын!
                </span>
            </h1>

            <div class="space-y-4 text-gray-600 text-lg leading-relaxed">
                <p>
                    Бұл күн Сізге жылы жымиыс пен ең ізгі эмоциялар сыйласын. Әрбір сәтіңіз қуанышқа толы болып, барлық бастамаларыңызға сәттілік серік болсын деп тілеймін.
                </p>
                <p class="font-medium text-gray-800">
                    Арман-тілектеріңіз орындалып, өміріңіз жарқын бояуларға толсын!
                </p>
            </div>

            <div class="mt-8 pt-6 border-t border-white/40 flex justify-center items-center gap-2">
                <span class="text-rose-500 animate-pulse text-2xl">❤</span>
                <span class="text-sm uppercase tracking-widest text-gray-500 font-bold">Ең ізгі тілекпен</span>
            </div>
        </div>
    </div>

    <script>
        // Конфетти эффектісі
        function createConfetti() {
            const colors = ['#fb7185', '#c084fc', '#60a5fa', '#facc15'];
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.opacity = Math.random();
                document.body.appendChild(confetti);
            }
        }
        createConfetti();
    </script>
</body>
</html>
